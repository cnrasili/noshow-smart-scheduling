name: Branch cleanup

# Each person keeps only their most recently updated branch
on:
  create:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: branch-cleanup

jobs:
  cleanup:
    if: github.event_name != 'create' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Delete outdated branches
        run: python .github/scripts/cleanup_branches.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXEMPT_LOGINS: cnrasili
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
