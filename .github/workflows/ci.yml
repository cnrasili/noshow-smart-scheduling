name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noshow
          POSTGRES_PASSWORD: noshow
          POSTGRES_DB: noshow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noshow -d noshow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -c constraints.txt ruff -e db -e "web/backend[dev]" -e "overbooking-service[dev]" -e "admin-service[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test web backend
        run: pytest web/backend
        env:
          NOSHOW_TEST_DATABASE_URL: postgresql+psycopg://noshow:noshow@127.0.0.1:5432/noshow_test
      - name: Test overbooking service
        run: pytest overbooking-service
      - name: Test admin service
        run: pytest admin-service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
