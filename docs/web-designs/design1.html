  return `<table><tr><th>Grup</th><th class="r">Randevu</th><th class="r">Gelmeyen</th><th class="r">Gelmeme oranı</th></tr>
 ${g.map((x) => `<tr><td>${x.group === 'reminder' ? 'Hatırlatma' : 'Kontrol'}</td><td class="r">${fmt(x.appointments)}</td><td class="r">${fmt(x.no_shows)}</td><td class="r"><b>${pcs(x.no_show_rate)}</b></td></tr>`).join('')}</table>
 <p style="margin:10px 0 0">Fark (kontrol − hatırlatma): <b>${(AB.difference * 100).toLocaleString('tr-TR', { minimumFractionDigits: 1 })} puan</b> · z = ${AB.z.toLocaleString('tr-TR')} · p ${AB.p_value < 0.001 ? '' : '= '}${pv(AB.p_value)}</p>
 <p style="margin:8px 0 0;font-size:12px;opacity:.8"><b>Bu gerçek bir deney değil.</b> Veri setindeki “SMS_received” alanı kullanıldı; gruplar rastgele seçilmedi, bu yüzden fark nedensel okunamaz (SMS alanların gelmeme oranı daha yüksek). Ekran, <code>GET /ab/summary</code> yanıtıyla aynı alanları gösterir; gerçek test başladığında aynı tablo canlı doldurulur. Aynı hastanın randevuları bağımsız olmadığından yönetim ekranında “hasta başına” seçeneği de sunulmalıdır.</p>`;
}

// Management: decision text of one booking.
const decisionText = (b) => (b.kind === 'extra' ? `slottaki 1. hastanın riski ≥ eşik %${THR}` : 'Normal randevu (slot boştu)');
// Staff: calendar helpers shared by both designs.
const dayTag = (i) => (DATA_DAYS.has(i) ? 'kayıt' : i === TODAY ? 'bugün' : '');

const state={role:'hasta',tab:'al',month:5,day:null,slot:null,confirmed:null,kural:'thr30',dday:TODAY,dmonth:5,dshow:200,kday:REAL};
const TABS={hasta:[['al','Randevu al'],['benim','Randevularım']],personel:[['gun','Bugünkü program']],yonetim:[['ozet','Özet'],['karar','Randevu kararları'],['msg','Mesajlar ve A/B']]};
const PORTAL={hasta:['✚','Hasta portalı'],personel:['⚕','Poliklinik paneli'],yonetim:['▣','Yönetim paneli']};
const riskCls=r=>r>=30?'high':r>=15?'mid':'low',riskTxt=r=>r>=30?'Yüksek':r>=15?'Orta':'Düşük';
const names={none:'Kural yok',thr20:'Eşik %20',thr30:'Eşik %30',thr40:'Eşik %40',cost05:'Maliyet kuralı r=0,5',ev:'Havayolu kuralı',paper:'Makale yöntemi'};
$('#hname').textContent=D.hospital;
$('#roles').innerHTML=[['hasta','Hasta'],['personel','Personel'],['yonetim','Yönetim']].map(([k,l])=>`<button data-role="${k}">${l}</button>`).join('');
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;state.tab=TABS[state.role][0][0];draw();});

// ---------- HASTA ----------
function monthGrid(){const y=2016,m=state.month,first=dowOf(isoOf(y,m,1)),n=new Date(y,m+1,0).getDate();let h=DOW.map(d=>`<div class="dw">${d}</div>`).join('')+'<div class="cd empty"></div>'.repeat(first);
  for(let d=1;d<=n;d++){const i=isoOf(y,m,d),open=isOpenDay(i),fc=freeCount(i),mine=myBookings().some(b=>b.iso===i);
    const cls=!open?'closed':fc>0?'free':'none';
    h+=`<button class="cd ${cls} ${mine?'mine':''} ${state.day===i?'on':''}" ${open?`data-d="${i}"`:'disabled'}><b>${d}</b><small>${!open?(dowOf(i)>=5?'Kapalı':'Geçti'):fc>0?fc+' müsait':'Dolu'}</small></button>`;}
  return h;}
const who=()=>`<p style="margin:0 0 10px;font-size:13px;color:var(--mute)">Giriş yapan hasta (demo): <select id="cur">${PATIENTS.map(p=>`<option value="${p.id}" ${p.id===CUR?'selected':''}>${p.id}</option>`).join('')}</select></p>`;
function hasta(){
  if(state.tab==='benim')return `${who()}<h1>Randevularım</h1><p class="sub">Alınan randevular ve size gönderilen mesajlar.</p>
  <div class="grid g2"><div class="card"><h2>Randevular</h2><table><tr><th>Tarih</th><th>Saat</th><th>Randevu no</th><th></th></tr>${myBookings().map(b=>`<tr><td>${longDate(b.iso)}</td><td><b>${b.time}</b></td><td>${b.no}</td><td class="r"><button class="btn ghost" data-c="${b.no}">İptal</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mute)">Aktif randevunuz yok.</td></tr>'}</table>
  <div class="note">Gelemeyecekseniz lütfen randevunuzu iptal edin: boşalan saat başka bir hastaya verilebilir.</div></div>
  <div class="card"><h2>Mesajlar</h2>${inboxHtml()}</div></div>`;
  const sl=state.day?slotsOf(state.day):[],sel=state.slot!==null&&state.day?sl[state.slot]:null;
  return `${who()}<h1>Randevu al</h1><p class="sub">${D.department} (Genel Poliklinik). Takvimden günü, sonra saati seçin.</p>
  <div class="steps"><span class="step ${state.confirmed?'':'on'}"><i>1</i>Gün ve saat</span><span class="step ${state.confirmed?'on':''}"><i>2</i>Onay</span></div>
  <div class="grid g2"><div class="card"><div class="mhead"><button data-m="-1" ${state.month<=5?'disabled':''}>‹</button><b>${MONTHS[state.month]} 2016</b><button data-m="1" ${state.month>=6?'disabled':''}>›</button></div>
   <div class="mgrid">${monthGrid()}</div>
   <div class="legend"><span><i style="background:var(--okbg);border:1px solid #9bd3b6"></i>Müsait saat var</span><span><i style="background:var(--soft)"></i>Dolu</span><span><i style="border:1px dashed var(--mute)"></i>Kapalı</span><span><i style="border:2px solid var(--brand)"></i>Randevum var</span></div></div>
  <div class="grid" style="align-content:start">
   ${state.confirmed?`<div class="card ok-card"><h2>Randevunuz alındı ✓</h2><p style="margin:0">${longDate(state.confirmed.iso)}<br>Saat <b>${state.confirmed.time}</b> · Randevu no <b>${state.confirmed.no}</b></p><p style="margin:10px 0 0;color:var(--mute);font-size:13px">Onay mesajı e-posta adresinize gönderildi.</p><p><button class="btn ghost" id="again">Yeni randevu</button></p></div>`
    :`<div class="card"><h2>${state.day?longDate(state.day):'Gün seçin'}</h2>${state.day?`<div class="slots">${sl.map(s=>`<button class="slot ${s.mine?'mine':s.open?'free':'full'} ${state.slot===s.k?'sel':''}" data-s="${s.k}" ${s.open?'':'disabled'}><b>${s.time}</b><small>${s.mine?'Randevum':s.open?'Müsait':'Dolu'}</small></button>`).join('')}</div>
     <p style="margin:14px 0 0"><button class="btn" id="ok" ${sel?'':'disabled'}>${sel?sel.time+' için randevu al':'Bir saat seçin'}</button></p>`:'<p style="color:var(--mute);margin:0">Takvimde müsait saati olan bir güne tıklayın.</p>'}</div>`}
   <div class="card"><h2>Randevularım</h2><table>${myBookings().map(b=>`<tr><td><b>${b.iso.slice(8)}.${b.iso.slice(5,7)}</b></td><td>${b.time}</td><td class="r"><small style="color:var(--mute)">${b.no}</small></td></tr>`).join('')||'<tr><td style="color:var(--mute)">Aktif randevunuz yok.</td></tr>'}</table></div></div></div>`;}

// ---------- HEKİM ----------
function docCal(){const y=2016,m=state.dmonth,first=dowOf(isoOf(y,m,1)),n=new Date(y,m+1,0).getDate();let h=DOW.map(d=>`<div class="dw">${d}</div>`).join('')+'<div class="cd empty"></div>'.repeat(first);
  for(let d=1;d<=n;d++){const i=isoOf(y,m,d),c=BK.filter(b=>b.iso===i).length,tag=DATA_DAYS.has(i)?'kayıt':c?c+' randevu':'';
    h+=`<button class="cd ${DATA_DAYS.has(i)?'none':c?'free':''} ${i===TODAY?'mine':''} ${state.dday===i?'on':''}" data-dd="${i}"><b>${d}</b><small>${tag}</small></button>`;}
  return h;}
function personel(){const day=staffDay(state.dday),L=day.list,live=day.mode==='today',rec=day.mode==='data';
  const got=L.filter(p=>live?ATT[p.key]==='g':p.outcome==='g').length,miss=L.filter(p=>live?ATT[p.key]==='n':p.outcome==='n').length,wait=L.length-got-miss;
  const next=live?L.find(p=>!ATT[p.key]):null,times=[...new Set(L.map(p=>p.time))];
  const empty={none:'Bu gün için kayıt yok.',today:'Bugün için randevu yok. Hasta panelinden randevu alındığında burada görünür.',future:'Bu gün için henüz randevu alınmadı.'}[day.mode]||'';
  const btn=p=>live?`<span class="att"><button class="${ATT[p.key]==='g'?'on-ok':''}" data-a="g|${p.key}">Geldi</button><button class="${ATT[p.key]==='n'?'on-no':''}" data-a="n|${p.key}">Gelmedi</button></span>`:'';
  const flow=rec?`<table><tr><th>Randevu no</th><th>Yaş</th><th>Sonuç (kayıt)</th></tr>${L.slice(0,state.dshow).map(p=>`<tr><td>${p.id}</td><td>${p.age}</td><td><span class="badge ${p.outcome==='g'?'b-low':'b-high'}">${p.outcome==='g'?'Geldi':'Gelmedi'}</span></td></tr>`).join('')}</table>${L.length>state.dshow?`<p style="margin:10px 0 0"><button class="btn ghost" data-more="1">Daha fazla göster (${fmt(L.length-state.dshow)} kayıt daha)</button></p>`:''}`
   :L.length?`<div class="tl">${times.map(t=>`<div class="t">${t}</div><div class="c">${L.filter(p=>p.time===t).map(p=>`<div class="pt ${next&&next.key===p.key?'next':''} ${live&&ATT[p.key]==='g'?'ok':live&&ATT[p.key]==='n'?'no':''}"><span class="id">Hasta ${p.id}</span><span class="grow">${p.age?p.age+' yaşında':''}</span>${btn(p)}</div>`).join('')}</div>`).join('')}</div>`:`<p style="color:var(--mute);margin:0">${empty}</p>`;
  return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><button class="btn ghost" data-dn="-1">‹ Önceki gün</button><h1 style="flex:1;margin:0">${longDate(state.dday)}</h1><button class="btn ghost" data-dn="1">Sonraki gün ›</button><button class="btn ghost" data-dn="0">Bugün</button></div>
  <p class="sub">${D.department}${rec?' · veri seti günü: günün tüm gerçek randevuları, sonuçlar kayıttır ve değiştirilemez':live?' · bugün':''}</p>
  <div class="chips"><div class="chip"><small>Randevu</small><b>${fmt(L.length)}</b></div><div class="chip"><small>Geldi</small><b>${fmt(got)}</b></div><div class="chip"><small>Gelmedi</small><b>${fmt(miss)}</b></div><div class="chip"><small>${live?'Bekleyen':'Gelmeme oranı'}</small><b>${live?wait:L.length?pcs(miss/L.length):'—'}</b></div></div>
  <div class="grid g2"><div class="card"><h2>${rec?'Günün randevuları':'Gün akışı'}</h2><div class="scroll">${flow}</div></div>
  <div class="grid" style="align-content:start"><div class="card"><div class="mhead"><button data-dm="-1" ${state.dmonth<=3?'disabled':''}>‹</button><b>${MONTHS[state.dmonth]} 2016</b><button data-dm="1" ${state.dmonth>=6?'disabled':''}>›</button></div><div class="mgrid">${docCal()}</div><div class="legend"><span><i style="background:var(--soft)"></i>Kayıtlı veri günü</span><span><i style="background:var(--okbg);border:1px solid #9bd3b6"></i>Randevu var</span><span><i style="border:2px solid var(--brand)"></i>Bugün</span></div></div>
   <div class="card"><h2>Sıradaki hasta</h2>${next?`<p style="margin:0;font-size:20px"><b>${next.time}</b> · Hasta ${next.id}</p><p style="margin:4px 0 0;color:var(--mute)">${next.age} yaşında</p>`:`<p style="margin:0;color:var(--mute)">${live?'Bekleyen hasta yok.':'Yalnızca bugün için gösterilir.'}</p>`}</div></div></div>`;}

// ---------- YÖNETİM ----------
function yonetim(){
  if(state.tab==='karar')return karar();
  if(state.tab==='msg'){const last=BK[BK.length-1];return `<h1>Mesajlar ve A/B</h1><p class="sub">Onay ve hatırlatma planı; hatırlatmanın gelmeme oranına etkisi</p>
   <div class="grid g2"><div class="card"><h2>Mesaj planı · ${last?last.no:'örnek'}</h2>${msgTable(last?last.iso:REAL,last?last.time:'09:00')}</div><div class="card"><h2>Hatırlatma A/B testi</h2>${abTable()}</div></div>`;}
  const b=R.none,r=R[state.kural];
  const k=(l,key,good,dec)=>{const v=r[key],w=b[key],d=v-w,p=100*d/w,cls=Math.abs(p)<.05?'neu':(d*good>0?'good':'bad');const sh=dec?f1:fmt;return `<div class="card kpi"><small>${l}</small><b>${sh(v)}</b><small>Kural yok: ${sh(w)}</small><div class="d ${cls}">${d>=0?'+':''}${sh(d)} (${p>=0?'+':''}${f1(p)}%)</div></div>`};
  const mx=Math.max(...Object.keys(names).map(x=>R[x].seen));
  return `<h1>Özet</h1><p class="sub">${D.model.days} günün tüm gerçek randevuları (${fmt(D.model.records)}) · yalnızca yönetim görür</p>
  <div style="margin-bottom:14px">Karşılaştırılan kural: <span class="seg">${['thr20','thr30','thr40','cost05'].map(x=>`<button data-r="${x}" class="${state.kural===x?'on':''}">${names[x]}</button>`).join('')}</span></div>
  <div class="grid g5">${k('Görülen hasta','seen',1,0)}${k('Ortalama bekleme (dk)','wait',-1,1)}${k('Doluluk (%)','util',1,1)}${k('Boşta kalma (saat)','idle_h',-1,0)}${k('Mesai aşımı (saat)','ot_h',-1,0)}</div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h2>Kuralların karşılaştırması</h2>
   <table><tr><th>Kural</th><th class="r">Görülen</th><th class="r">Bekleme dk</th><th class="r">Doluluk</th><th class="r">Boşta saat</th><th class="r">Mesai aşımı saat</th></tr>
   ${Object.keys(names).map(x=>`<tr class="${x===state.kural?'hl':''}"><td>${names[x]}</td><td class="r">${fmt(R[x].seen)}</td><td class="r">${f1(R[x].wait)}</td><td class="r">${f1(R[x].util)}%</td><td class="r">${fmt(R[x].idle_h)}</td><td class="r">${fmt(R[x].ot_h)}</td></tr>`).join('')}</table>
   <h2 style="margin-top:18px">Görülen hasta sayısı</h2>${Object.keys(names).map(x=>`<div class="barrow"><span>${names[x]}</span><div class="t"><i style="width:${100*R[x].seen/mx}%;${x==='none'?'background:var(--mute)':''}"></i></div><b>${fmt(R[x].seen)}</b></div>`).join('')}</div>
  <div class="grid" style="align-content:start"><div class="card"><h2>Etkin kural</h2><p style="margin:0"><b>Eşik kuralı %${THR}</b> · slot başına en çok 2 hasta · günde en çok 4 ek randevu</p><div class="note">Bu ayarlar ve hastaların gelmeme riski <b>yalnızca yönetim ekranında</b> görünür. Hasta takvimde yalnızca “müsait / dolu”, personel yalnızca kendi programını görür.</div></div>
   <div class="card"><h2>Okuma notu</h2><p style="margin:0;color:var(--mute)">Fazladan randevu hasta sayısını artırır ve muayene odasının boş kalma süresini azaltır, ancak <b>ortalama beklemeyi de artırır</b>. Değerler simülasyon varsayımlarına (${D.assumptions.slots} slot x ${D.assumptions.slot_min} dk, ortalama ${D.assumptions.service_mean} dk muayene) bağlıdır.</p></div></div></div>`;}
function karar(){const all=AS.slots.flatMap(sl=>sl.patients.map(p=>({...p,time:sl.time})));
  const exp=all.reduce((a,p)=>a+p.risk/100,0),high=all.filter(p=>p.risk>=30).length,ob=all.filter(p=>p.extra).length;
  return `<h1>Randevu kararları</h1><p style="margin:0 0 6px;font-size:13px;color:var(--mute)">Gün: ${adayPicker()}</p><p class="sub">Oturum ${AS.session_no} · ${longDate(ADAY)} · her randevunun risk ve overbooking kararı</p>
  <div class="chips"><div class="chip"><small>Randevu</small><b>${all.length}</b></div><div class="chip"><small>Beklenen gelmeme oranı</small><b>${pcs(exp/all.length)}</b></div><div class="chip"><small>Yüksek riskli</small><b>${high}</b></div><div class="chip"><small>Ek (overbook) randevu</small><b>${ob}</b></div></div>
  <div class="card"><table><tr><th>Saat</th><th>Randevu no</th><th>Yaş</th><th>Gelmeme riski</th><th>Karar</th><th>Gerçek sonuç</th></tr>
  ${all.map(p=>`<tr><td><b>${p.time}</b></td><td>${p.id}</td><td>${p.age}</td><td><div style="display:flex;gap:10px;align-items:center"><div class="meter"><i style="width:${Math.min(100,p.risk*1.6)}%;background:var(--${p.risk>=30?'bad':p.risk>=15?'warn':'ok'})"></i></div><span class="badge b-${riskCls(p.risk)}">%${p.risk} ${riskTxt(p.risk)}</span></div></td>
   <td>${p.extra?'<span class="badge b-ob">Ek randevu verildi</span>':'Normal randevu'}</td><td>${p.showed?'Geldi':'Gelmedi'}</td></tr>`).join('')}</table>
  <div class="note"><b>Risk nasıl hesaplanır?</b> Yalnızca randevu alındığı anda bilinen bilgiler kullanılır (yaş, randevuya kalan gün, hasta geçmişi gibi); SMS bilgisi ve mahalle kullanılmaz. Modelin ayırt etme gücü AUC ${String(D.model.auc).replace('.',',')} (0,5 = şans). Bir slota ikinci hasta, slottaki hastanın riski %${THR} ve üstündeyse yazılır.</div></div>
  <div class="card" style="margin-top:16px"><h2>Veri günleri: gerçek randevular ve risk</h2><div class="scroll" style="max-height:340px">${dayStatsTable(ADAY)}</div><div class="note">Risk, modelin o güne hiç görmeden yaptığı tahmindir. Personel ekranında bu günler salt okunurdur.</div></div>
  <div class="card" style="margin-top:16px"><h2>Hasta panelinden alınan randevular</h2><table><tr><th>Tarih</th><th>Saat</th><th>Hasta</th><th>Randevu no</th><th>Hasta riski (örnek)</th><th>Karar</th></tr>
  ${BK.filter(b=>!b.old).map(b=>`<tr><td>${longDate(b.iso)}</td><td>${b.time}</td><td>${b.pid}</td><td>${b.no}</td><td>%${b.risk}</td><td>${b.kind==='extra'?'<span class="badge b-ob">Ek randevu</span> ':''}${decisionText(b)}</td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mute)">Henüz randevu alınmadı. Hasta ekranından randevu alınca burada görünür.</td></tr>'}</table>
  <div class="note">Demo: gelmeme riski modelinin API'si bağlı olmadığından yeni randevuların riski gerçek risk dağılımından örneklenir. Aynı saate ikinci hasta, ilk hastanın riski %${THR} ve üstündeyse ve günlük ${LIM} ek randevu dolmadıysa yazılır.</div></div>`;}
function draw(){document.body.dataset.role=state.role;
  document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.role===state.role));
  $('#logo').textContent=PORTAL[state.role][0];$('#portal').textContent=PORTAL[state.role][1];
  $('#nav').innerHTML=TABS[state.role].map(([k,l])=>`<button data-t="${k}" class="${state.tab===k?'on':''}">${l}</button>`).join('');
  $('#nav').style.display=TABS[state.role].length>1?'flex':'none';
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;draw();});
  $('#app').innerHTML={hasta,personel,yonetim}[state.role]();
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.month+=+b.dataset.m;state.day=null;state.slot=null;draw();});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.day=b.dataset.d;state.slot=null;state.confirmed=null;draw();});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{state.slot=+b.dataset.s;draw();});
  const ok=$('#ok');if(ok)ok.onclick=()=>{state.confirmed=addBooking(state.day,state.slot);state.slot=null;draw();};
  const ag=$('#again');if(ag)ag.onclick=()=>{state.confirmed=null;draw();};
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cancelBooking(b.dataset.c);draw();});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const[t,key]=b.dataset.a.split('|');ATT[key]=ATT[key]===t?null:t;draw();});
  const ad=$('#aday');if(ad)ad.onchange=()=>{setAday(ad.value);draw();};
  const cur=$('#cur');if(cur)cur.onchange=()=>{CUR=+cur.value;state.slot=null;state.confirmed=null;draw();};
  document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{state.dday=b.dataset.dd;state.dshow=200;draw();});
  document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{state.dshow+=300;draw();});
  document.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{state.kday=b.dataset.kd;draw();});
  document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{state.dmonth+=+b.dataset.dm;draw();});
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const n=+b.dataset.dn;state.dshow=200;state.dday=n===0?TODAY:addDays(state.dday,n);state.dmonth=+state.dday.slice(5,7)-1;draw();});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.kural=b.dataset.r;draw();});}
draw();
</script></body></html>
