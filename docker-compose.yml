services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noshow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noshow}
      POSTGRES_DB: ${POSTGRES_DB:-noshow}
    # Internal services are published on the loopback interface only
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noshow} -d ${POSTGRES_DB:-noshow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noshow}:${POSTGRES_PASSWORD:-noshow}@db:5432/${POSTGRES_DB:-noshow}
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  web-backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noshow}:${POSTGRES_PASSWORD:-noshow}@db:5432/${POSTGRES_DB:-noshow}
      OVERBOOKING_SERVICE_URL: http://overbooking-service:8001
      FRONTEND_ORIGIN: http://localhost:${WEB_FRONTEND_PORT:-5173}
      # Internal account API for the admin service; disabled while empty
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Length of newly generated slots in minutes; 20 while empty
      SLOT_MINUTES: ${SLOT_MINUTES:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${WEB_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./web/backend/web_backend:/app/web/backend/web_backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  web-frontend:
    build:
      context: web/frontend
    environment:
      VITE_API_URL: http://localhost:${WEB_BACKEND_PORT:-8000}
      WATCH_POLLING: "true"
    ports:
      - "${WEB_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./web/frontend/src:/app/src
    depends_on:
      - web-backend

  overbooking-service:
    build:
      context: .
      dockerfile: overbooking-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noshow}:${POSTGRES_PASSWORD:-noshow}@db:5432/${POSTGRES_DB:-noshow}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-clinic@noshow.local}
      WATCHFILES_FORCE_POLLING: "true"
    # Reached by the web backend and the admin service over the Docker network
    ports:
      - "127.0.0.1:${OVERBOOKING_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./overbooking-service/overbooking_service:/app/overbooking-service/overbooking_service
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-noshow}:${POSTGRES_PASSWORD:-noshow}@db:5432/${POSTGRES_DB:-noshow}
      ADMIN_OVERBOOKING_SERVICE_URL: http://overbooking-service:8001
      # Requests from the host reach the container through the Docker network gateway
      ADMIN_ALLOWED_NETWORKS: ${ADMIN_ALLOWED_NETWORKS:-127.0.0.0/8,::1/128,172.16.0.0/12}
      WATCHFILES_FORCE_POLLING: "true"
    # Published on the loopback interface only: other machines cannot reach the admin service
    ports:
      - "127.0.0.1:${ADMIN_SERVICE_PORT:-8002}:8002"
    volumes:
      - ./admin-service/admin_service:/app/admin-service/admin_service
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
