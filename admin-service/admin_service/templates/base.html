<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}{% endblock %} · {{ panel_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}" />
  </head>
  <body>
    {% if admin %}
    <nav aria-label="Yönetim">
      <strong>{{ panel_name }}</strong>
      <a href="{{ url_for('kpi_page') }}">Göstergeler</a>
      <a href="{{ url_for('decisions_page') }}">Model kararları</a>
      <a href="{{ url_for('patients_page') }}">Hastalar</a>
      <a href="{{ url_for('doctors_page') }}">Hekimler</a>
      <a href="{{ url_for('audit_page') }}">Denetim kaydı</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf(request) }}" />
        <span class="muted">{{ admin.email }}</span>
        <button type="submit" class="secondary">Çıkış</button>
      </form>
    </nav>
    {% endif %}
    <main>{% block content %}{% endblock %}</main>
    {% block scripts %}{% endblock %}
  </body>
</html>
