{% extends "base.html" %}
{% block title %}Administrator login{% endblock %}
{% block content %}
<section class="login">
  <h1>Hospital administration</h1>
  <p class="muted">Internal network only. Every login is recorded.</p>
  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('login') }}" class="stack">
    <label>
      Email
      <input type="email" name="email" autocomplete="username" required maxlength="255" />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required maxlength="255" />
    </label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
