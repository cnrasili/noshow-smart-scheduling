[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow-web-backend"
version = "0.1.0"
description = "Backend of the appointment booking application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]

[tool.setuptools.packages.find]
include = ["web_backend*"]
