line-length = 100
target-version = "py311"
src = ["db", "web/backend", "overbooking-service", "admin-service"]

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Report pages are built from embedded HTML, CSS and JavaScript strings
"simulation/{app,dashboard,live_day,main,real_days}.py" = ["E501"]
"simulation/templates/**/*.py" = ["E501"]
# Console reports and long explanatory docstrings of the replication script
"ml/paper_replication.py" = ["E501"]
