[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow-db"
version = "0.1.0"
description = "Shared database models and migrations"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
include = ["noshow_db*"]
